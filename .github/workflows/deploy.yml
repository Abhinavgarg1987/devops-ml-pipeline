name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests (CI Phase)
      env:
        PYTHONPATH: .
      run: |
        pytest tests/

    - name: Build Docker Image (CD Phase)
      run: |
        docker build -t devops-ml-app:latest .